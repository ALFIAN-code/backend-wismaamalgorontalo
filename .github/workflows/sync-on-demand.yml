name: Sync Fork from Upstream

on:
  repository_dispatch:
    types: [sync-backend]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          ref: staging
          token: ${{ secrets.GHCR_PAT }} # Use PAT so the push triggers the deploy workflow

      - name: Sync upstream changes
        run: |
          git remote add upstream https://github.com/rizaldinata/backend-wismaamalgorontalo.git
          git fetch upstream
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          
          # Check if there are changes
          HEAD_HASH=$(git rev-parse HEAD)
          UPSTREAM_HASH=$(git rev-parse upstream/staging)
          
          if [ "$HEAD_HASH" != "$UPSTREAM_HASH" ]; then
            echo "Changes detected, merging..."
            git merge upstream/staging --no-edit
            git push origin staging
          else
            echo "Fork is up to date."
          fi
